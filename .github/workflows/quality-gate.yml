name: Tests
on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
jobs:
  test:
    name: Quality Gate
    # プルリクエストがdraft,release,docの時は実行しない
    if: |
      github.event.pull_request.draft == false
      && !startsWith(github.head_ref, 'release')
      && !startsWith(github.head_ref, 'doc')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build and Test with Gradle
        continue-on-error: true
        run: ./gradlew --no-daemon clean check test --fail-fast
      - name: Create annotation for build error
        run: echo "::warning file=src/main/java/com/example/demo/DemoApplication.java,line=9::Testing annotation"
      - name: Create Temporary Directory
        run: mkdir tmp
      - name: Produce Output
        id: producer_step
        run: echo "result=Test output" >> $GITHUB_OUTPUT
      - name: Consume Output
        run: echo "Output = ${{steps.producer_step.outputs.result}}"
      - name: Find Warning Suppressions
        run: |
          chmod +x .github/scripts/report-suppress-warnings.sh 
          git fetch origin ${{ github.base_ref }}
          .github/scripts/report-suppress-warnings.sh tmp/warnings_table.txt origin/main
      - name: Parse PMD result
        run: |
          echo "\n\nPMD\n" >> tmp/warnings_table.txt
          echo "|Type|Message|Location|" >> tmp/warnings_table.txt
          echo "|--|--|--|" >> tmp/warnings_table.txt
          jq -r '.runs[].results[] | "|" + .ruleId + "|" + .message.text + "|" + .locations[0].physicalLocation.artifactLocation.uri + ":" + (.locations[0].physicalLocation.region.startLine | tostring) + "-" + (.locations[0].physicalLocation.region.endLine | tostring) + "|"' build/reports/pmd/main.sarif.json >> tmp/warnings_table.txt
          # GitHub workflow annotations so findings are marked on the PR files view.
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-error-message
          jq -r --arg workspace "${GITHUB_WORKSPACE}" '
            def gha_prop:
              gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C");
            def gha_msg:
              gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            .runs[].results[] |
            . as $r |
            .locations[0].physicalLocation as $loc |
            ($loc.artifactLocation.uri
              | sub("^file://"; "")
              | if ($workspace | length) > 0 and startswith($workspace + "/")
                then .[$workspace | length + 1:]
                else . end) as $file |
            "::error " +
            ([
              "file=\($file | gha_prop)",
              "line=\($loc.region.startLine)",
              (if $loc.region.endLine then "endLine=\($loc.region.endLine)" else empty end),
              (if $loc.region.startColumn then "col=\($loc.region.startColumn)" else empty end),
              (if $loc.region.endColumn then "endColumn=\($loc.region.endColumn)" else empty end),
              "title=\($r.ruleId | gha_prop)"
            ] | join(",")) +
            "::\($r.message.text | gha_msg)"
          ' build/reports/pmd/main.sarif.json
          [ "$(jq '.runs[0].results | length' build/reports/pmd/main.sarif.json)" -ne 0 ] && exit 1
      - name: Comment PR
        if: always()
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: tmp/warnings_table.txt
          comment-tag: warnings_table
